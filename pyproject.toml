[project]
name = "archive-news-cc"
description = "Closed captions of TV news from the Internet Archive's TV News Archive: identifier search, fetch, parse, Parquet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Suriyan Laohaprapanon" },
    { name = "Gaurav Sood", email = "gsood07@gmail.com" },
]
keywords = ["news", "corpus", "scraping", "parquet"]
requires-python = ">=3.12"
version = "1.0.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "internetarchive>=5.11",
    "pyarrow>=21",
    "pyDataverse>=0.3.5",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/notnews/archive_news_cc"
Repository = "https://github.com/notnews/archive_news_cc"
Data = "https://doi.org/10.7910/DVN/OAJJHI"

[project.scripts]
archive-news-cc = "archive_news_cc.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "archive_news_cc"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8"]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
