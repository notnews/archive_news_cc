version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Dependabot's default keeps only the dependencies pyproject.toml names
    # current. Everything they pull in sits in uv.lock untouched until an
    # advisory or an upstream floor forces the issue: gojiplus/reporoulette
    # carried grpcio 1.76 for eleven months, then google-auth 2.57 started
    # warning at import that 1.83 is the floor, and with warnings as errors
    # every test module failed at collection. finite-sample/incline's mistune
    # CVE was the same shape. The grouped weekly PR absorbs the extra churn.
    allow:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases that are at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
